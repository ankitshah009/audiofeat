[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiofeat"
dynamic = ["version"]
authors = [
    {name = "Ankit Shah", email = "ankit.tronix@gmail.com"},
]
description = "A comprehensive PyTorch-based audio feature extraction library for machine learning, research, and audio analysis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",

    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
    "audio",
    "feature-extraction", 
    "signal-processing",
    "pytorch",
    "machine-learning",
    "speech",
    "voice",
    "spectrogram",
    "mfcc",
    "spectral-features",
    "temporal-features",
    "pitch-detection",
    "audio-analysis",
    "music-information-retrieval",
    "mir",
    "dsp",
    "audio-processing"
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "torch>=1.9.0",
    "torchaudio>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/ankitshah009/audiofeat"
Repository = "https://github.com/ankitshah009/audiofeat"
Documentation = "https://github.com/ankitshah009/audiofeat#readme"
"Bug Reports" = "https://github.com/ankitshah009/audiofeat/issues"

[project.scripts]
audiofeat = "audiofeat.cli:main"

[project.optional-dependencies]
# --- Feature-scoped model extras (one per pretrained-model backend) ---
asr = ["openai-whisper>=202311"]                                  # audiofeat.asr (Whisper)
vad = ["silero-vad>=5.0"]                                         # audiofeat.vad (needs load_silero_vad, >=5)
diarization = ["pyannote.audio>=3.1", "huggingface-hub>=0.21.0"]  # audiofeat.diarization
embeddings = ["speechbrain>=1.0.0"]                               # audiofeat.embeddings (ECAPA)
ssl = ["transformers>=4.30.0"]                                    # audiofeat.ssl (wav2vec2/HuBERT)
emotion = ["transformers>=4.30.0"]                                # audiofeat.emotion_ssl
scene = ["panns_inference>=0.1.0"]                                # audiofeat.scene (PANNs CNN14)
separation = ["asteroid>=0.5.0"]                                  # audiofeat.spatial (ConvTasNet)
denoise = ["noisereduce", "rnnoise-torch"]                        # audiofeat.denoise (RNNoise)
beat = ["madmom>=0.16.1"]                                         # audiofeat.beat_madmom

# Convenience: union of every model backend above.
models = [
    "openai-whisper>=202311",
    "silero-vad>=5.0",
    "pyannote.audio>=3.1",
    "huggingface-hub>=0.21.0",
    "speechbrain>=1.0.0",
    "transformers>=4.30.0",
    "panns_inference>=0.1.0",
    "asteroid>=0.5.0",
    "noisereduce",
    "rnnoise-torch",
    "madmom>=0.16.1",
]

# Audio I/O backend for torchaudio>=2.1 (load/save .wav etc.).
io = [
    "soundfile>=0.12",
    "torchcodec>=0.1",
]

dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "isort",
    "flake8",
    "mypy",
]
examples = [
    "matplotlib",
    "librosa",
    "soundfile",
]
validation = [
    "praat-parselmouth>=0.4.3",
]
standards = [
    "opensmile>=2.5.0",
]
full = [
    # examples
    "matplotlib",
    "librosa",
    "soundfile",
    # validation
    "praat-parselmouth>=0.4.3",
    # standards
    "opensmile>=2.5.0",
    # io backends
    "torchcodec>=0.1",
    # models (union)
    "openai-whisper>=202311",
    "silero-vad>=5.0",
    "pyannote.audio>=3.1",
    "huggingface-hub>=0.21.0",
    "speechbrain>=1.0.0",
    "transformers>=4.30.0",
    "panns_inference>=0.1.0",
    "asteroid>=0.5.0",
    "noisereduce",
    "rnnoise-torch",
    "madmom>=0.16.1",
]

[tool.setuptools.dynamic]
version = {attr = "audiofeat._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["audiofeat*"]
exclude = ["tests*", "examples*"]

[tool.setuptools.package-data]
audiofeat = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.coverage.report]
fail_under = 80
