name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install audio backend (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install audio backend (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,examples,validation,standards,io]"
      - name: Run unit tests with coverage gate
        run: pytest tests/ --cov=audiofeat --cov-report=term-missing --cov-fail-under=80 -q
      - name: Type-check with mypy (non-blocking)
        continue-on-error: true
        run: mypy audiofeat

  gold-standard:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: 'pip'
      - name: Install audio backend (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,examples,validation,standards,io]"
      - name: Run gold-standard score gate
        run: audiofeat gold-standard --no-optional --min-score 100 --fail-on-any
